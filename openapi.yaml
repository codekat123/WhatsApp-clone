openapi: 3.0.3
info:
  title: WhatsApp Clone API
  description: |
    API documentation for the WhatsApp Clone application.
    This API provides endpoints for user authentication, profile management, and chat functionality.
  version: 1.0.0
  contact:
    name: API Support
    url: https://example.com/support
    email: support@example.com

servers:
  - url: http://localhost:8000/api
    description: Local development server
  - url: https://api.whatsapp-clone.com/v1
    description: Production server

components:
  securitySchemes:
    JWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the authentication endpoints

  schemas:
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Error message explaining what went wrong
      
    Message:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the message
        content:
          type: string
          description: The message content
        sender:
          type: integer
          format: int64
          description: ID of the user who sent the message
        chat:
          type: integer
          format: int64
          description: ID of the chat this message belongs to
        created_at:
          type: string
          format: date-time
          description: Timestamp when the message was created

    TokenPair:
      type: object
      properties:
        refresh:
          type: string
          description: Refresh token used to obtain new access tokens
        access:
          type: string
          description: Access token for authenticating API requests

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: User's unique identifier
        phone_number:
          type: string
          description: User's phone number
        first_name:
          type: string
          description: User's first name
        last_name:
          type: string
          description: User's last name
        email:
          type: string
          format: email
          description: User's email address
        profile_picture:
          type: string
          format: uri
          description: URL to the user's profile picture
        last_login:
          type: string
          format: date-time
          description: Timestamp of the user's last login

    OTPRequest:
      type: object
      required:
        - phone_number
      properties:
        phone_number:
          type: string
          description: User's phone number in international format
          example: "+201234567890"

    OTPVerification:
      type: object
      required:
        - phone_number
        - otp
      properties:
        phone_number:
          type: string
          description: User's phone number in international format
          example: "+201234567890"
        otp:
          type: string
          description: One-time password received via SMS
          example: "123456"
        first_name:
          type: string
          description: User's first name (required for registration)
          example: "John"
        last_name:
          type: string
          description: User's last name (optional)
          example: "Doe"
        email:
          type: string
          format: email
          description: User's email address (optional)
          example: "john.doe@example.com"

    ProfileUpdate:
      type: object
      properties:
        first_name:
          type: string
          description: Updated first name
        last_name:
          type: string
          description: Updated last name
        email:
          type: string
          format: email
          description: Updated email address
        profile_picture:
          type: string
          format: binary
          description: New profile picture

    GroupCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the group
        description:
          type: string
          description: Optional group description
        participants:
          type: array
          items:
            type: integer
            format: int64
            description: List of user IDs to add to the group

    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          description: New name for the group
        description:
          type: string
          description: New description for the group

    GroupMemberOperation:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer
          format: int64
          description: ID of the user to add/remove/make admin

    BlockUser:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer
          format: int64
          description: ID of the user to block/unblock

paths:
  # Authentication Endpoints
  /users/api/token/:
    post:
      tags: [Authentication]
      summary: Obtain JWT token pair
      description: Authenticate user and receive access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_number
                - password
              properties:
                phone_number:
                  type: string
                  description: User's phone number
                password:
                  type: string
                  format: password
                  description: User's password
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/api/token/refresh/:
    post:
      tags: [Authentication]
      summary: Refresh JWT token
      description: Get a new access token using a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh
              properties:
                refresh:
                  type: string
                  description: Valid refresh token
      responses:
        '200':
          description: New access token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                    description: New access token
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/send-otp/:
    post:
      tags: [Authentication]
      summary: Send OTP to phone number
      description: Sends a one-time password to the provided phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "OTP sent successfully"
        '400':
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/verify-otp/:
    post:
      tags: [Authentication]
      summary: Verify OTP and register/login
      description: Verify the OTP and complete user registration or login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerification'
      responses:
        '200':
          description: User authenticated/registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Invalid OTP or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # User Profile Endpoints
  /users/profile/update:
    patch:
      tags: [User Profile]
      summary: Update user profile
      description: Update the authenticated user's profile information
      security:
        - JWTAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Authentication credentials were not provided

  # Chat Endpoints
  /chat/groups/:
    post:
      tags: [Chat - Groups]
      summary: Create a new group
      description: Create a new group chat with the specified members
      security:
        - JWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                    description: ID of the created group
                  name:
                    type: string
                    description: Name of the group
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Authentication required

  /chat/groups/{group_id}/:
    patch:
      tags: [Chat - Groups]
      summary: Update group information
      description: Update the name or description of a group
      security:
        - JWTAuth: []
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the group to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Group updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Group updated successfully"
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - User is not an admin of the group
        '404':
          description: Group not found

    delete:
      tags: [Chat - Groups]
      summary: Delete a group
      description: Delete a group (only group admin can delete)
      security:
        - JWTAuth: []
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the group to delete
      responses:
        '204':
          description: Group deleted successfully
        '403':
          description: Forbidden - Only group admin can delete the group
        '404':
          description: Group not found

  /chat/groups/{group_id}/members/:
    post:
      tags: [Chat - Groups]
      summary: Add member to group
      description: Add a user to the group (admin only)
      security:
        - JWTAuth: []
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberOperation'
      responses:
        '200':
          description: Member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Member added successfully"
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Only group admin can add members
        '404':
          description: Group or user not found

  /chat/groups/{group_id}/admins/:
    post:
      tags: [Chat - Groups]
      summary: Make member an admin
      description: Make a group member an admin (group admin only)
      security:
        - JWTAuth: []
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberOperation'
      responses:
        '200':
          description: Admin rights granted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User is now a group admin"
        '400':
          description: Invalid input data or user is not a group member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Only group admin can grant admin rights
        '404':
          description: Group or user not found

  /chat/private/{user_id}/:
    get:
      tags: [Chat - Private]
      summary: Get or create private chat
      description: Get an existing private chat or create a new one if it doesn't exist
      security:
        - JWTAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the other user in the private chat
      responses:
        '200':
          description: Chat retrieved/created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '400':
          description: Cannot create chat with self or user is blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found

  /chat/block/{user_id}/:
    post:
      tags: [Chat - Blocking]
      summary: Block or unblock a user
      description: Toggle block status for a user
      security:
        - JWTAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the user to block/unblock
      responses:
        '200':
          description: Block status toggled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User blocked successfully"
        '400':
          description: Cannot block self
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found

  /users/logout/:
    post:
      tags: [Authentication]
      summary: Logout user
      description: Invalidate the user's refresh token
      security:
        - JWTAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully logged out"
        '400':
          description: No refresh token provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
